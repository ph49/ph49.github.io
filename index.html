<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ph49 - Projects</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Premium Styling (Glassmorphism) */
        :root {
            --bg-color: #0f111a;
            --bg-gradient: linear-gradient(135deg, #0f111a 0%, #1a1c2e 50%, #0d0e15 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --font-family: 'Outfit', sans-serif;
        }
        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 3rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin: 2rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            letter-spacing: -0.05em;
        }
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }
        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
        }
        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ph49 projects</h1>
        <div class="links-grid">

            <a href="kanji/index.html" class="card">
                <span class="card-title">漢字 Yes We Kanji</span>
                <span class="card-desc">Japanese Kanji flashcard & quiz app (Grades 1-3).</span>
            </a>
            <a href="hanzi/index.html" class="card">
                <span class="card-title">汉字 Hands on Hanzi</span>
                <span class="card-desc">Simplified Chinese Hanzi flashcard, quiz & audio app (HSK 1-3).</span>
            </a>
            <a href="say-when/index.html" class="card">
                <span class="card-title">Say When!</span>
                <span class="card-desc">A low-tech, geeky timeline game.</span>
            </a>
            <a href="conscons.html" class="card">
                <span class="card-title">conscons</span>
                <span class="card-desc">Another interesting project in the repository.</span>
            </a>
        </div>
    </div>
</body>
</html>
