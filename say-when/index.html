<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A low-tech, geeky timeline game.">
    <title>Say When! - Geeky Timeline Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="terminal-container">
        <header class="terminal-header">
            <div class="title-row">
                <h1>SAY WHEN!</h1>
                <button id="settings-btn" class="icon-button">⚙</button>
            </div>
            <div class="scoreboard">
                <div>SCORE: <span id="score-current">00</span></div>
                <div id="best-score-container" class="clickable">
                    BEST: <span id="score-high">00</span>
                    <!-- Reset Score Confirmation Modal -->
                    <div id="reset-score-modal" class="modal" style="display: none;">
                        <div class="modal-content">
                            <div class="modal-buttons">
                                <button id="confirm-reset-btn" class="popover-button">RESET TO 0</button>
                                <button id="cancel-reset-btn" class="popover-button">CANCEL</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div>ANACHRONISMS: <span id="lives-count">0/3</span></div>
            </div>
            <div class="controls">
                <label for="category-select">CATEGORY:</label>
                <select id="category-select" class="terminal-select">
                    <option value="lucky-dip">🎲 LUCKY DIP</option>

                </select>
            </div>
        </header>

        <main class="terminal-main">
            <section class="pending-section">
                <h2>PENDING EVENTS</h2>
                <div id="next-event-container" class="pending-container">
                    <!-- Cards will be inserted here -->
                </div>
            </section>

            <section class="timeline-section">
                <h2>TIMELINE</h2>
                <div id="timeline" class="timeline-container">
                    <!-- Timeline line and items will be inserted here -->
                </div>
            </section>
        </main>


    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p>Correct Dates</p>
            <ul id="outstanding-cards-list">
                <!-- List items will be inserted here -->
            </ul>
            <button id="new-game-btn" class="terminal-button">NEW GAME</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>SETTINGS</h2>
            <div class="settings-group">
                <label>
                    <input type="checkbox" id="setting-prefix-category"> Prefix event with category
                </label>
            </div>
            <div class="settings-group">
                <label>
                    <input type="checkbox" id="setting-month-accuracy"> Month accuracy
                </label>
            </div>
            <div class="settings-group">
                <label>
                    <input type="checkbox" id="setting-dark-mode"> Dark mode
                </label>
            </div>
            <div class="settings-group">
                <label>Pending cards:</label>
                <label><input type="radio" name="pending-count" value="1"> 1</label>
                <label><input type="radio" name="pending-count" value="2"> 2</label>
                <label><input type="radio" name="pending-count" value="3" checked> 3</label>
            </div>
            <div class="modal-buttons">
                <button id="save-settings-btn" class="terminal-button">SAVE</button>
                <button id="close-settings-btn" class="terminal-button">CLOSE</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
