<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A premium timeline game where you place historical events in order.">
    <title>hi-story-board - Test Your History Knowledge</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="game-header">
            <div class="title-area">
                <h1>hi-story-board</h1>
                <div class="controls">
                    <label for="category-select" class="sr-only">Select Category:</label>
                    <select id="category-select" class="glass-select">
                        <option value="lucky-dip">🎲 Lucky Dip</option>
                        <option value="science">🔬 Science</option>
                        <option value="history">📜 History</option>
                        <option value="pop-culture">🍿 Pop Culture</option>
                        <option value="literature">📚 Literature</option>
                        <option value="sport">⚽ Sport</option>
                        <option value="boomer-life">👵 Boomer Life</option>
                        <option value="us-politics">🇺🇸 US Politics</option>
                        <option value="extinctions">🦖 Extinctions</option>
                        <option value="fictional-events">🔮 Fictional Events</option>
                        <option value="natural-disasters">🌋 Natural Disasters</option>
                    </select>
                </div>
            </div>
            <div class="scoreboard">
                <div class="score-item">
                    <span class="score-label">Score</span>
                    <span id="score-current" class="score-value">0</span>
                </div>
                <div class="score-item" id="best-score-item">
                    <span class="score-label">Best</span>
                    <span id="score-high" class="score-value">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">Anachronisms</span>
                    <span id="lives-count" class="score-value">0/3</span>
                </div>
            </div>
        </header>

        <main class="game-area">
            <section class="next-event-section">
                <h2 id="next-event-heading">Next Event to Place</h2>
                <div id="next-event-container">
                    <!-- Cards will be dynamically inserted here -->
                </div>
            </section>

            <section class="timeline-section">
                <h2>Timeline</h2>
                <div id="timeline" class="timeline-container">
                    <!-- Timeline events will be inserted here -->
                    <div class="timeline-line"></div>
                    <!-- Drop zones and cards will be added dynamically -->
                </div>
            </section>
        </main>

        <footer class="game-footer">
            <p>Vibe coded with <span id="vibe-emoji">❤️</span></p>
        </footer>
    </div>

    <!-- Script -->
    <script src="app.js"></script>
</body>
</html>
